<div
    class="admin-sidebar"
    [class.collapsed]="isCollapsed">

    <div class="sidebar-logo">
        <img src="assets/images/logo-main.png" alt="Tiệm Hoa Yên" *ngIf="!isCollapsed">
        <button type="button" class="collapse-btn" (click)="toggleSidebar()">
            <i class="bi bi-layout-sidebar-inset"></i>
        </button>
    </div>

    <div class="menu-section">
        <a
            *ngFor="let item of mainMenuItems"
            [routerLink]="canView(item.module) ? item.route : null"
            [routerLinkActiveOptions]="{ exact: !!item.exact }"
            routerLinkActive="active"
            class="menu-item"
            [class.active]="isItemActive(item)"
            [class.disabled]="!canView(item.module)"
            [attr.aria-disabled]="!canView(item.module)"
            (click)="openMenu(item, $event)">
            <i class="bi" [ngClass]="item.icon"></i>
            <span>{{ item.label }}</span>
        </a>
    </div>

    <div class="menu-section">
        <p class="menu-title">Admin</p>

        <a
            *ngFor="let item of adminMenuItems"
            [routerLink]="canView(item.module) ? item.route : null"
            routerLinkActive="active"
            class="menu-item"
            [class.active]="isItemActive(item)"
            [class.disabled]="!canView(item.module)"
            [attr.aria-disabled]="!canView(item.module)"
            (click)="openMenu(item, $event)">
            <i class="bi" [ngClass]="item.icon"></i>
            <span>{{ item.label }}</span>
        </a>
    </div>

    <div class="sidebar-footer">
        <div class="admin-info" role="button" tabindex="0" (click)="logout()" (keydown.enter)="logout()">
            <i class="bi bi-person-circle"></i>

            <div>
                <h4>Tiệm Hoa Yên</h4>
                <span>{{ adminEmail }}</span>
            </div>

            <i class="bi bi-box-arrow-right"></i>
        </div>

        <button class="store-btn" type="button" (click)="openStore()">
            <i class="bi bi-shop"></i>
            Cửa hàng của bạn
            <i class="bi bi-box-arrow-up-right"></i>
        </button>
    </div>
</div>

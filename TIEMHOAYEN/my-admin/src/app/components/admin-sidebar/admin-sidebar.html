<div
    class="admin-sidebar"
    [class.collapsed]="isCollapsed">

    <div class="sidebar-logo">
        <img src="assets/images/logo-main.png" alt="Tiệm Hoa Yên" *ngIf="!isCollapsed">
        <button type="button" class="collapse-btn" (click)="toggleSidebar()">
            <i class="bi bi-layout-sidebar-inset"></i>
        </button>
    </div>

    <div class="menu-section">
        <ng-container *ngFor="let item of mainMenuItems">
            <ng-container *ngIf="canView(item.module)">
            <a
                [routerLink]="canView(item.module) ? item.route : null"
                [routerLinkActiveOptions]="{ exact: !!item.exact }"
                routerLinkActive="active"
                class="menu-item"
                [class.active]="isItemActive(item)"
                [class.group-active]="isGroupActive(item)"
                [class.disabled]="!canView(item.module)"
                [attr.aria-disabled]="!canView(item.module)"
                (click)="openMenu(item, $event)">
                <i class="bi" [ngClass]="item.icon"></i>
                <span>{{ item.label }}</span>
                <button *ngIf="item.children?.length && !isCollapsed" type="button" class="submenu-toggle"
                    [attr.aria-expanded]="isGroupOpen(item)" [attr.aria-label]="(isGroupOpen(item) ? 'Thu gọn ' : 'Mở ') + item.label"
                    (click)="toggleGroup(item, $event)">
                    <i class="bi" [ngClass]="isGroupOpen(item) ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
                </button>
            </a>
            <div class="submenu" *ngIf="item.children?.length && !isCollapsed && isGroupOpen(item)">
                <a
                    *ngFor="let child of visibleChildren(item)"
                    [routerLink]="canView(child.module) ? child.route : null"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: !!child.exact }"
                    class="submenu-item"
                    [class.active]="isItemActive(child)"
                    [class.disabled]="!canView(child.module)"
                    (click)="openMenu(child, $event)">
                    <span>{{ child.label }}</span>
                </a>
            </div>
            </ng-container>
        </ng-container>
    </div>

    <div class="menu-section" *ngIf="hasAdminItems">
        <p class="menu-title">Admin</p>

        <ng-container *ngFor="let item of adminMenuItems">
        <a
            *ngIf="canView(item.module)"
            [routerLink]="canView(item.module) ? item.route : null"
            routerLinkActive="active"
            class="menu-item"
            [class.active]="isItemActive(item)"
            [class.disabled]="!canView(item.module)"
            [attr.aria-disabled]="!canView(item.module)"
            (click)="openMenu(item, $event)">
            <i class="bi" [ngClass]="item.icon"></i>
            <span>{{ item.label }}</span>
        </a>
        </ng-container>
    </div>

    <div class="sidebar-footer">
        <div class="admin-info" role="button" tabindex="0" (click)="logout()" (keydown.enter)="logout()">
            <i class="bi bi-person-circle"></i>

            <div>
                <h4>Tiệm Hoa Yên</h4>
                <span>{{ adminEmail }}</span>
            </div>

            <i class="bi bi-box-arrow-right"></i>
        </div>

        <button class="store-btn" type="button" (click)="openStore()">
            <i class="bi bi-shop"></i>
            Cửa hàng của bạn
            <i class="bi bi-box-arrow-up-right"></i>
        </button>
    </div>
</div>

<main class="category-page">
  <nav class="category-breadcrumb" id="categoryBreadcrumb" aria-label="Breadcrumb">
    <a routerLink="/category">Sản phẩm</a>
  </nav>

  <section class="selected-filter-row" id="selectedFilterRow">
    <span class="selected-filter-title">Bộ lọc đang chọn:</span>
    <div class="selected-filter-list" id="selectedFilterList"></div>
  </section>

  <section class="mobile-filter-row" aria-label="Bộ lọc rút gọn">
    <div class="mobile-filter-field">
      <label for="mobileFilterSelect">Lọc sản phẩm:</label>
      <select id="mobileFilterSelect">
        <option value="" selected>Chọn mục lọc</option>
      </select>
    </div>

    <div class="mobile-price-filter" aria-label="Khoảng giá">
      <label class="mobile-price-title">Khoảng giá</label>

      <div class="filter-content price-filter-content">
        <div class="price-range-labels">
          <span>0đ</span>
          <span>7tr</span>
        </div>

        <div class="price-range-control">
          <div class="price-range-track"></div>
          <div class="price-range-fill price-range-fill-sync"></div>
          <input
            class="price-min-range"
            type="range"
            min="0"
            max="7000000"
            step="50000"
            value="0"
            aria-label="Giá thấp nhất trên điện thoại">
          <input
            class="price-max-range"
            type="range"
            min="0"
            max="7000000"
            step="50000"
            value="7000000"
            aria-label="Giá cao nhất trên điện thoại">
        </div>

        <div class="price-range-value price-range-value-sync">
          0đ - 7.000.000đ
        </div>
      </div>
    </div>
  </section>

  <section class="category-layout">
    <aside class="filter-sidebar" aria-label="Bộ lọc sản phẩm">

      <div class="filter-group">
        <button class="filter-title" type="button" aria-expanded="true">
          <span>Chủ đề</span>
          <i class="chevron bi bi-chevron-up" aria-hidden="true"></i>
        </button>

        <div class="filter-content">
          <label>
            <input type="checkbox" data-group="chuDe" data-all-topics="true" value="Tất cả">
            Tất cả
          </label>

          <label>
            <input type="checkbox" data-group="chuDe" data-id="CD001" value="Hoa tình yêu">
            Hoa tình yêu
          </label>

          <label>
            <input type="checkbox" data-group="chuDe" data-id="CD002" value="Hoa sinh nhật">
            Hoa sinh nhật
          </label>

          <label>
            <input type="checkbox" data-group="chuDe" data-id="CD007" value="Hoa cưới">
            Hoa cưới
          </label>

          <label>
            <input type="checkbox" data-group="chuDe" data-id="CD005" value="Hoa Tết">
            Hoa Tết
          </label>

          <label>
            <input type="checkbox" data-group="chuDe" data-id="CD003" value="Hoa khai trương">
            Hoa khai trương
          </label>

          <label>
            <input type="checkbox" data-group="chuDe" data-id="CD004" value="Hoa chúc mừng">
            Hoa chúc mừng
          </label>

          <label>
            <input type="checkbox" data-group="chuDe" data-id="CD008" value="Hoa sự kiện">
            Hoa sự kiện
          </label>

          <label>
            <input type="checkbox" data-group="chuDe" data-id="CD006" value="Hoa Chia Buồn">
            Hoa Chia Buồn
          </label>

          <label>
            <input type="checkbox" data-group="chuDe" data-id="CD009" value="Hoa tốt nghiệp">
            Hoa tốt nghiệp
          </label>
        </div>
      </div>

      <div class="filter-group price-filter-group">
        <button class="filter-title" type="button" aria-expanded="true">
          <span>Khoảng giá</span>
          <i class="chevron bi bi-chevron-up" aria-hidden="true"></i>
        </button>

        <div class="filter-content price-filter-content">
          <div class="price-range-labels">
            <span>0đ</span>
            <span>7tr</span>
          </div>

          <div class="price-range-control" id="priceRangeControl">
            <div class="price-range-track"></div>
            <div class="price-range-fill price-range-fill-sync" id="priceRangeFill"></div>
            <input
              id="priceMinRange"
              class="price-min-range"
              type="range"
              min="0"
              max="7000000"
              step="50000"
              value="0"
              aria-label="Giá thấp nhất">
            <input
              id="priceMaxRange"
              class="price-max-range"
              type="range"
              min="0"
              max="7000000"
              step="50000"
              value="7000000"
              aria-label="Giá cao nhất">
          </div>

          <div class="price-range-value price-range-value-sync" id="priceRangeValue">
            0đ - 7.000.000đ
          </div>
        </div>
      </div>

      <div class="filter-group">
        <button class="filter-title" type="button" aria-expanded="true">
          <span>Kiểu dáng</span>
          <i class="chevron bi bi-chevron-up" aria-hidden="true"></i>
        </button>

        <div class="filter-content">
          <label><input type="checkbox" data-group="kieuDang" value="Bình hoa"> Bình hoa</label>
          <label><input type="checkbox" data-group="kieuDang" value="Bó hoa"> Bó hoa</label>
          <label><input type="checkbox" data-group="kieuDang" value="Giỏ hoa"> Giỏ hoa</label>
          <label><input type="checkbox" data-group="kieuDang" value="Giỏ hoa khai trương"> Giỏ hoa khai trương</label>
          <label><input type="checkbox" data-group="kieuDang" value="Hộp hoa"> Hộp hoa</label>
          <label><input type="checkbox" data-group="kieuDang" value="Hộp Hoa Tươi"> Hộp Hoa Tươi</label>
          <label><input type="checkbox" data-group="kieuDang" value="Khung hoa"> Khung hoa</label>
          <label><input type="checkbox" data-group="kieuDang" value="Lẵng hoa Khai Trương"> Lẵng hoa Khai Trương</label>
          <label><input type="checkbox" data-group="kieuDang" value="Vòng Hoa Tang"> Vòng Hoa Tang</label>
        </div>
      </div>

      <div class="filter-group">
        <button class="filter-title" type="button" aria-expanded="true">
          <span>Hoa tươi</span>
          <i class="chevron bi bi-chevron-up" aria-hidden="true"></i>
        </button>

        <div class="filter-content">
          <label><input type="checkbox" data-group="hoaTuoi" data-id="HT001" value="Hoa Hồng"> Hoa Hồng</label>
          <label><input type="checkbox" data-group="hoaTuoi" data-id="HT002" value="Hoa Ly"> Hoa Ly</label>
          <label><input type="checkbox" data-group="hoaTuoi" data-id="HT003" value="Hoa Lan"> Hoa Lan</label>
          <label><input type="checkbox" data-group="hoaTuoi" data-id="HT004" value="Hoa Baby"> Hoa Baby</label>
          <label><input type="checkbox" data-group="hoaTuoi" data-id="HT005" value="Hoa Hướng Dương"> Hoa Hướng Dương</label>
          <label><input type="checkbox" data-group="hoaTuoi" data-id="HT006" value="Hoa Tulip"> Hoa Tulip</label>
          <label><input type="checkbox" data-group="hoaTuoi" data-id="HT007" value="Hoa Cúc Tana"> Hoa Cúc Tana</label>
          <label><input type="checkbox" data-group="hoaTuoi" data-id="HT008" value="Hoa Cúc"> Hoa Cúc</label>
          <label><input type="checkbox" data-group="hoaTuoi" data-id="HT009" value="Hoa Sen"> Hoa Sen</label>
          <label><input type="checkbox" data-group="hoaTuoi" data-id="HT010" value="Hoa Cát Tường"> Hoa Cát Tường</label>
          <label><input type="checkbox" data-group="hoaTuoi" data-id="HT011" value="Hoa Đồng Tiền"> Hoa Đồng Tiền</label>
          <label><input type="checkbox" data-group="hoaTuoi" data-id="HT012" value="Hoa Cẩm Chướng"> Hoa Cẩm Chướng</label>
          <label><input type="checkbox" data-group="hoaTuoi" data-id="HT013" value="Hoa Huệ"> Hoa Huệ</label>
        </div>
      </div>

      <div class="filter-group">
        <button class="filter-title" type="button" aria-expanded="true">
          <span>Đối tượng</span>
          <i class="chevron bi bi-chevron-up" aria-hidden="true"></i>
        </button>

        <div class="filter-content">
          <label><input type="checkbox" data-group="doiTuong" data-id="DT001" value="Người yêu"> Người yêu</label>
          <label><input type="checkbox" data-group="doiTuong" data-id="DT002" value="Vợ"> Vợ</label>
          <label><input type="checkbox" data-group="doiTuong" data-id="DT003" value="Bạn Trai"> Bạn Trai</label>
          <label><input type="checkbox" data-group="doiTuong" data-id="DT004" value="Mẹ"> Mẹ</label>
          <label><input type="checkbox" data-group="doiTuong" data-id="DT005" value="Sếp"> Sếp</label>
          <label><input type="checkbox" data-group="doiTuong" data-id="DT006" value="Chồng"> Chồng</label>
        </div>
      </div>

      <div class="filter-group">
        <button class="filter-title" type="button" aria-expanded="true">
          <span>Màu sắc</span>
          <i class="chevron bi bi-chevron-up" aria-hidden="true"></i>
        </button>

        <div class="filter-content">
          <label><input type="checkbox" data-group="mauSac" data-id="MS001" value="Trắng"> Trắng</label>
          <label><input type="checkbox" data-group="mauSac" data-id="MS002" value="Đỏ"> Đỏ</label>
          <label><input type="checkbox" data-group="mauSac" data-id="MS003" value="Hồng"> Hồng</label>
          <label><input type="checkbox" data-group="mauSac" data-id="MS004" value="Cam"> Cam</label>
          <label><input type="checkbox" data-group="mauSac" data-id="MS005" value="Tím"> Tím</label>
          <label><input type="checkbox" data-group="mauSac" data-id="MS006" value="Vàng"> Vàng</label>
          <label><input type="checkbox" data-group="mauSac" data-id="MS007" value="Xanh"> Xanh</label>
        </div>
      </div>

    </aside>

    <section class="product-section">
      <div class="sort-row">
        <label for="sortSelect">Sắp xếp:</label>

        <div class="sort-dropdown" id="sortDropdown">
          <button
            type="button"
            class="sort-dropdown-toggle"
            id="sortDropdownToggle"
            aria-haspopup="listbox"
            aria-expanded="false">
            <span id="sortDropdownLabel">Mặc định</span>
            <i class="bi bi-chevron-down"></i>
          </button>

          <div
            class="sort-dropdown-menu"
            id="sortDropdownMenu"
            role="listbox"
            aria-labelledby="sortDropdownToggle">
            <button class="sort-option is-selected" type="button" role="option" aria-selected="true" data-sort-value="default">Mặc định</button>
            <button class="sort-option" type="button" role="option" aria-selected="false" data-sort-value="priceAsc">Giá thấp đến cao</button>
            <button class="sort-option" type="button" role="option" aria-selected="false" data-sort-value="priceDesc">Giá cao đến thấp</button>
            <button class="sort-option" type="button" role="option" aria-selected="false" data-sort-value="nameAsc">Tên A - Z</button>
            <button class="sort-option" type="button" role="option" aria-selected="false" data-sort-value="nameDesc">Tên Z - A</button>
          </div>
        </div>

        <select id="sortSelect" class="native-sort-select" aria-hidden="true" tabindex="-1">
          <option value="default">Mặc định</option>
          <option value="priceAsc">Giá thấp đến cao</option>
          <option value="priceDesc">Giá cao đến thấp</option>
          <option value="nameAsc">Tên A - Z</option>
          <option value="nameDesc">Tên Z - A</option>
        </select>
      </div>

      <div class="product-grid" id="productGrid"></div>

      <p class="empty-message" id="emptyMessage" hidden>
        Không có sản phẩm phù hợp với bộ lọc.
      </p>

      <div class="bottom-row">
        <div class="pagination" id="pagination"></div>
        <p class="result-count" id="resultCount"></p>
      </div>
    </section>
  </section>
</main>

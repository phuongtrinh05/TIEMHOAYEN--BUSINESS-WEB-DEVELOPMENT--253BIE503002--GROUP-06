<section class="blog-page">
    <section class="blog-banner">
        <video
        class="blog-video"
        src="assets/video/blog_video.mp4"
        autoplay
        muted
        loop
        playsinline
        >
        Trình duyệt của bạn không hỗ trợ video.
        </video>
    </section>
    <main class="blog-list-wrapper">
        <article class="blog-item" *ngFor="let post of posts">
            <a
                class="blog-item-link"
                [routerLink]="['/blog-detail', post.id]"
            >
                <div class="blog-item-image">
                    <img [src]="post.image" [alt]="post.title">
                </div>

                <div class="blog-item-content">
                    <h2>{{ post.title }}</h2>
                    <p>{{ post.excerpt }}</p>
                    <span>Ngày đăng tải: {{ post.date }}</span>
                </div>
            </a>
        </article>

        <div class="blog-pagination" *ngIf="totalPages > 1">
            <button
                type="button"
                class="page-btn"
                [disabled]="currentPage === 1"
                (click)="prevPage()"
            >
                ‹
            </button>

            <ng-container *ngFor="let p of pageNumbers">
                <span *ngIf="p === '...'" class="page-dots">...</span>
                <button
                    *ngIf="p !== '...'"
                    type="button"
                    class="page-btn"
                    [class.active]="p === currentPage"
                    (click)="goToPage(+p)"
                >
                    {{ p }}
                </button>
            </ng-container>

            <button
                type="button"
                class="page-btn"
                [disabled]="currentPage === totalPages"
                (click)="nextPage()"
            >
                ›
            </button>
        </div>

        <p class="pagination-note">
            {{ showingText }}
        </p>
    </main>
</section>

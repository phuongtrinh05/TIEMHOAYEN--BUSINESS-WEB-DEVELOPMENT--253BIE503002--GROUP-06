<section class="blog-page">
    <main class="blog-list-wrapper">
        <article class="blog-item" *ngFor="let post of posts">
            <a
                class="blog-item-link"
                [href]="post.id === 1 ? '/blog-detail' : 'javascript:void(0)'"
                [class.disabled-link]="post.id !== 1"
            >
                <div class="blog-item-image">
                    <img [src]="post.image" [alt]="post.title">
                </div>

                <div class="blog-item-content">
                    <h2>{{ post.title }}</h2>
                    <p>{{ post.excerpt }}</p>
                    <span>Ngày đăng tải: {{ post.date }}</span>
                </div>
            </a>
        </article>

        <div class="blog-pagination">
            <button type="button" class="page-btn">
                ‹
            </button>

            <button type="button" class="page-btn active">
                1
            </button>

            <button type="button" class="page-btn">
                2
            </button>

            <span class="page-dots">...</span>

            <button type="button" class="page-btn">
                7
            </button>

            <button type="button" class="page-btn">
                8
            </button>

            <button type="button" class="page-btn">
                ›
            </button>
        </div>

        <p class="pagination-note">
            Hiển thị 1-4/30 bài viết
        </p>
    </main>
</section>

<div class="fail-overlay">
  <div class="fail-box">

    <button type="button" class="popup-close" (click)="closePopup()">
      <i class="bi bi-x-lg"></i>
    </button>

    <div class="fail-icon">
      <i class="bi bi-x-lg"></i>
    </div>

    <p class="fail-message">Thanh toán thất bại</p>

    <p class="fail-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

    <div class="fail-actions">
      <button
        type="button"
        class="btn-retry"
        [disabled]="isRetrying"
        (click)="retryPayment()"
      >
        {{ isRetrying ? 'Đang tạo mã...' : 'Thử lại' }}
      </button>

      <button type="button" class="btn-continue-shop" routerLink="/homepage">
        Tiếp tục mua sắm
      </button>
    </div>

  </div>
</div>

<app-page-header-2></app-page-header-2>
<section class="forgot-password-page">

  <!-- LEFT -->
  <div class="forgot-password-left">

    <div class="forgot-password-left__content">

      <p class="forgot-password-left__slogan">
        Gửi trao yêu thương<br>
        qua những bó hoa tươi thắm
      </p>

      <div class="forgot-password-left__features">

        <div class="feature-item">
          <div class="feature-item__icon">
            <i class="bi bi-heart"></i>
          </div>

          <div class="feature-item__text">
            <span class="feature-item__title">
              Hoa tươi mỗi ngày
            </span>

            <span class="feature-item__desc">
              Tuyển chọn chất lượng
            </span>
          </div>
        </div>

        <div class="feature-item">
          <div class="feature-item__icon">
            <i class="bi bi-box-seam"></i>
          </div>

          <div class="feature-item__text">
            <span class="feature-item__title">
              Giao hàng nhanh chóng
            </span>

            <span class="feature-item__desc">
              Đảm bảo đúng hẹn
            </span>
          </div>
        </div>

        <div class="feature-item">
          <div class="feature-item__icon">
            <i class="bi bi-shield-check"></i>
          </div>

          <div class="feature-item__text">
            <span class="feature-item__title">
              Thanh toán an toàn
            </span>

            <span class="feature-item__desc">
              Bảo mật thông tin
            </span>
          </div>
        </div>

      </div>

    </div>

  </div>

  <!-- RIGHT -->
  <div class="forgot-password-right">

    <div class="forgot-password-card">

      <h1 class="forgot-password-card__title">
        Quên mật khẩu
      </h1>

      <form
        class="forgot-password-form"
        (ngSubmit)="onSubmit()"
        #forgotPasswordForm="ngForm"
        novalidate
      >

        <!-- Mật khẩu mới -->
        <div class="form-group">

          <label
            class="form-label"
            for="newPassword"
          >
            Mật khẩu mới
          </label>

          <div class="input-wrapper">

            <i class="bi bi-lock input-icon"></i>

            <input
              [type]="showNewPassword ? 'text' : 'password'"
              id="newPassword"
              name="newPassword"
              class="form-input"
              placeholder="Nhập mật khẩu mới"
              [(ngModel)]="formData.newPassword"
              #newPassword="ngModel"
              required
              minlength="6"
              [class.is-invalid]="newPassword.invalid && newPassword.touched"
            >

            <button
              type="button"
              class="toggle-password"
              (click)="toggleNewPassword()"
            >
              <i
                class="bi"
                [ngClass]="showNewPassword ? 'bi-eye-slash' : 'bi-eye'"
              ></i>
            </button>

          </div>

          <span
            class="error-msg"
            *ngIf="newPassword.invalid && newPassword.touched"
          >
            Mật khẩu tối thiểu 6 ký tự.
          </span>

        </div>

        <!-- Nhập lại mật khẩu -->
        <div class="form-group">

          <label
            class="form-label"
            for="confirmPassword"
          >
            Nhập lại mật khẩu mới
          </label>

          <div class="input-wrapper">

            <i class="bi bi-lock input-icon"></i>

            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              id="confirmPassword"
              name="confirmPassword"
              class="form-input"
              placeholder="Nhập lại mật khẩu mới"
              [(ngModel)]="formData.confirmPassword"
              #confirmPassword="ngModel"
              required
              [class.is-invalid]="
                confirmPassword.touched &&
                formData.newPassword !== formData.confirmPassword
              "
            >

            <button
              type="button"
              class="toggle-password"
              (click)="toggleConfirmPassword()"
            >
              <i
                class="bi"
                [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"
              ></i>
            </button>

          </div>

          <span
            class="error-msg"
            *ngIf="
              confirmPassword.touched &&
              formData.newPassword !== formData.confirmPassword
            "
          >
            Mật khẩu không khớp.
          </span>

        </div>

        <button
          type="submit"
          class="btn-confirm"
          [disabled]="
            forgotPasswordForm.invalid ||
            formData.newPassword !== formData.confirmPassword
          "
        >
          Xác nhận
        </button>

      </form>

    </div>

  </div>

</section>
<app-page-footer-2></app-page-footer-2>

<header class="header-2">
    <a routerLink="/">
        <img
            src="assets/images/logo-main.png"
            alt="Tiem Hoa Yen">
    </a>

    <div class="language-switch notranslate" aria-label="Language switcher" translate="no">
        <button
            type="button"
            class="notranslate"
            translate="no"
            [class.active]="currentLanguage === 'vi'"
            (click)="changeLanguage('vi')"
        >
            VI
        </button>

        <button
            type="button"
            class="notranslate"
            translate="no"
            [class.active]="currentLanguage === 'en'"
            (click)="changeLanguage('en')"
        >
            EN
        </button>
    </div>
</header>

services:
  - type: web
    name: tiem-hoa-yen-api
    runtime: node
    plan: free
    rootDir: TIEMHOAYEN/my-server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGO_URI
        sync: false
      - key: MONGO_DATABASE
        value: TIEM_HOA_YEN
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PASSWORD_HASH_ROUNDS
        value: 12
